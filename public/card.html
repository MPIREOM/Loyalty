<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>My Loyalty Card</title>
  <link rel="stylesheet" href="/styles.css" />

  <!-- Install as a home-screen app on iOS + Android -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/thePeak_logo_color.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="The Peak" />
  <meta name="theme-color" content="#1a1410" />
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="/thePeak_logo_color.png" alt="Logo" /></div>
    <h1 id="shop-name">Loyalty Card</h1>

    <div class="card" id="card-box">
      <div class="big-name" id="name">—</div>
      <div class="subtle" id="phone">—</div>

      <div class="stamps" id="stamps"></div>

      <div id="progress-line" class="subtle" style="text-align:center;margin-bottom:8px;"></div>

      <div class="qr-box" id="qr-box">
        <img id="qr" alt="Your loyalty QR" />
      </div>
      <p class="subtle" style="text-align:center;margin:4px 0 0">
        Tap the QR for a brighter, fullscreen view. Show it to the barista at each visit.
      </p>
    </div>

    <!-- "Save to your phone" card: PWA install prompt + optional wallet passes -->
    <div class="card" id="install-card">
      <h2 style="margin-top:0">Save to your phone</h2>
      <p id="install-hint">One-tap access to your card — no app store required.</p>
      <button id="install-btn" style="display:none">➕ Add to Home Screen</button>
      <div class="wallet-btns">
        <a id="apple-btn" href="#" style="display:none">  Add to Apple Wallet</a>
        <a id="google-btn" href="#" target="_blank" rel="noopener" style="display:none">Save to Google Wallet</a>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">Recent activity</h2>
      <div id="recent"></div>
    </div>

    <p class="subtle" style="text-align:center">
      <a href="#" id="save-link" style="color:var(--accent)">Bookmark this page</a> so you can come back anytime.
    </p>
  </div>

  <!-- Fullscreen QR overlay (shown when the customer taps the QR) -->
  <div id="qr-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;align-items:center;justify-content:center;flex-direction:column;padding:20px;">
    <img id="qr-big" alt="Your loyalty QR" style="width:min(90vw,90vh);height:auto;image-rendering:pixelated;" />
    <p style="color:#333;margin-top:20px;font-family:-apple-system,sans-serif;">Tap to close</p>
  </div>

  <script>
    const token = location.hash.slice(1);
    if (!token) location.href = '/register.html';

    document.getElementById('save-link').href = location.href;

    // Tap the QR → fullscreen white background at max brightness, which is
    // what baristas actually need to scan reliably in low light.
    const overlay = document.getElementById('qr-overlay');
    const qrBig = document.getElementById('qr-big');
    document.getElementById('qr-box').addEventListener('click', () => {
      qrBig.src = document.getElementById('qr').src;
      overlay.style.display = 'flex';
      // Request fullscreen — forces many phones to max brightness.
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });
    overlay.addEventListener('click', () => {
      overlay.style.display = 'none';
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    });

    // Android Chrome fires beforeinstallprompt when the PWA criteria are met.
    // iOS Safari doesn't support this event, so we show a manual hint instead.
    let deferredPrompt = null;
    const installBtn = document.getElementById('install-btn');
    const installHint = document.getElementById('install-hint');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = '';
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });

    // Show platform-specific text for iOS (no install API in Safari).
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                         window.navigator.standalone === true;
    if (isStandalone) {
      // Already installed — don't nag.
      document.getElementById('install-card').style.display = 'none';
    } else if (isIOS) {
      installHint.innerHTML =
        'Tap <b>Share <span style="font-family:system-ui">⬆</span></b> at the bottom of Safari, ' +
        'then <b>Add to Home Screen</b>. Your card becomes a one-tap icon.';
    }

    async function load() {
      const [cfgRes, cardRes] = await Promise.all([
        fetch('/api/config'),
        fetch('/api/card/' + encodeURIComponent(token)),
      ]);
      if (!cardRes.ok) {
        document.body.innerHTML = '<div class="wrap"><div class="card"><p>Card not found. Please <a href="/register.html" style="color:var(--accent)">register again</a>.</p></div></div>';
        return;
      }
      const cfg = await cfgRes.json();
      const data = await cardRes.json();

      document.getElementById('shop-name').textContent = cfg.shopName;
      document.title = cfg.shopName + ' — ' + data.customer.name;
      document.getElementById('name').textContent = data.customer.name;
      document.getElementById('phone').textContent = data.customer.phone;

      // stamps
      const stampsEl = document.getElementById('stamps');
      stampsEl.innerHTML = '';
      stampsEl.style.gridTemplateColumns = `repeat(${Math.min(6, data.stats.required)}, 1fr)`;
      for (let i = 0; i < data.stats.required; i++) {
        const d = document.createElement('div');
        d.className = 'stamp' + (i < data.stats.progress ? ' filled' : '');
        d.textContent = '☕';
        stampsEl.appendChild(d);
      }

      const p = document.getElementById('progress-line');
      if (data.stats.remaining === 0) {
        p.innerHTML = '<span style="color:var(--good);font-weight:600">🎉 Free drink ready on your next visit!</span>';
      } else {
        p.textContent = `${data.stats.remaining} more to go — total free drinks earned: ${data.stats.totalFree}`;
      }

      document.getElementById('qr').src = '/api/qr/' + encodeURIComponent(token);

      // Optional wallet passes (only shown when configured on the server).
      if (cfg.wallet.apple) {
        const a = document.getElementById('apple-btn');
        a.href = '/api/wallet/apple/' + encodeURIComponent(token);
        a.style.display = '';
      }
      if (cfg.wallet.google) {
        const g = document.getElementById('google-btn');
        g.style.display = '';
        g.addEventListener('click', async (e) => {
          e.preventDefault();
          const res = await fetch('/api/wallet/google/' + encodeURIComponent(token));
          const j = await res.json();
          if (j.url) window.open(j.url, '_blank');
        });
      }

      // recent
      const recentEl = document.getElementById('recent');
      if (!data.recent.length) {
        recentEl.innerHTML = '<p class="subtle">No purchases yet. Enjoy your first drink soon!</p>';
      } else {
        recentEl.innerHTML = data.recent.map(r => {
          const d = new Date(r.created_at);
          const when = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
          const label = r.type === 'free' ? '🎁 Free drink' : '☕ Drink';
          return `<div class="stat"><span class="label">${when}</span><span class="value">${label}</span></div>`;
        }).join('');
      }
    }
    load();

    // Auto-refresh every 30s so the card updates after the barista scans.
    setInterval(load, 30000);
  </script>
</body>
</html>
