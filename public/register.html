<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Join — Coffee Loyalty</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/thePeak_logo_color.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="The Peak" />
  <meta name="theme-color" content="#1a1410" />
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="/thePeak_logo_color.png" alt="Logo" /></div>
    <h1 id="shop-name">Coffee Loyalty</h1>
    <p>Buy <b id="drinks-required">6</b> drinks, get the next one <b>free</b>. Register once — then just show your QR at the counter.</p>

    <div class="card">
      <div id="ref-banner" style="display:none;padding:12px 14px;background:rgba(125,200,138,0.15);border-radius:10px;margin-bottom:12px;color:var(--good);font-size:14px;">
        🎁 You were invited! You'll start with a bonus stamp.
      </div>
      <form id="form">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="60" placeholder="Your name" />

        <label for="phone">Omani mobile number</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" required placeholder="9XXX XXXX" inputmode="tel" />

        <label for="birthday">Birthday (optional — free drink every year!) 🎂</label>
        <input id="birthday" name="birthday" type="text" inputmode="numeric" pattern="\d{2}-\d{2}" placeholder="MM-DD e.g. 07-15" maxlength="5" />

        <div id="msg"></div>
        <button type="submit" id="submit">Create my card</button>
      </form>
    </div>

    <p class="subtle">By registering you agree to receive loyalty updates. We only store your name, phone number, and (optional) birthday.</p>
  </div>

  <script>
    fetch('/api/config').then(r => r.json()).then(cfg => {
      document.getElementById('shop-name').textContent = cfg.shopName + ' Loyalty';
      document.getElementById('drinks-required').textContent = cfg.drinksRequired;
      document.title = 'Join — ' + cfg.shopName;
    });

    // Referral code from ?ref=<customer_id>
    const params = new URLSearchParams(location.search);
    const referralCode = params.get('ref') || '';
    if (referralCode) {
      document.getElementById('ref-banner').style.display = '';
    }

    // Normalize birthday input: auto-insert dash after month
    const birthdayInput = document.getElementById('birthday');
    birthdayInput.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '').slice(0, 4);
      if (v.length >= 3) v = v.slice(0, 2) + '-' + v.slice(2);
      e.target.value = v;
    });

    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.innerHTML = '';
      btn.disabled = true;
      btn.textContent = 'Creating…';
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            birthday: birthdayInput.value || undefined,
            referralCode: referralCode || undefined,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          msg.innerHTML = `<div class="msg error">${data.error || 'Something went wrong.'}</div>`;
          btn.disabled = false;
          btn.textContent = 'Create my card';
          return;
        }
        location.href = '/card.html#' + data.token;
      } catch (err) {
        msg.innerHTML = '<div class="msg error">Network error. Please try again.</div>';
        btn.disabled = false;
        btn.textContent = 'Create my card';
      }
    });
  </script>
</body>
</html>
